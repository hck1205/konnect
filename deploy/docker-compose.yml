# konnect 서비스 스택 (A1)
#
# **이 파일이 단일 출처다.** 서버의 /srv/app/konnect/docker-compose.yml 은 사본이며,
# 고친 뒤에는 반드시 설치해야 반영된다:
#
#   scp deploy/docker-compose.yml oracle-main:/tmp/konnect-compose.yml
#   ssh oracle-main 'sudo install -m 644 /tmp/konnect-compose.yml /srv/app/konnect/docker-compose.yml'
#
# 예전엔 서버에만 있었다. 그래서 저장소만 보는 사람은 스택의 모양을 알 수 없었고,
# 감시 작업을 붙이려는데 파일이 없어 막혔다 → docs/40-operations/03-deployment.md
#
# postgres/redis 는 여기서 정의하지 않는다 — /srv/docker/docker-compose.yml 의
# 기존 컨테이너를 core-network 로 공유한다. 프리티어 12GB 박스에 DB를 두 벌
# 띄울 이유가 없다. → ~/docs/fleet/konnect-deploy.md
#
# 이미지는 GHCR 에서 받는다. 서버에서 빌드하지 않는다(next build 2~4GB).
#
# 사용:
#   docker compose -f /srv/app/konnect/docker-compose.yml pull
#   docker compose -f /srv/app/konnect/docker-compose.yml run --rm migrate
#   docker compose -f /srv/app/konnect/docker-compose.yml up -d --wait

services:

  konnect-be:
    image: ${BE_IMAGE:-ghcr.io/hck1205/konnect-be:latest}
    container_name: konnect-be
    restart: always
    # `up -d --wait` 는 healthcheck 가 없으면 프로세스 생존만 본다.
    # 그러면 크래시 루프도, 부팅 중 멈춘 상태도 "떴다" 로 읽힌다.
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
    environment:
      NODE_ENV: production
      PORT: "4000"
      DB_DRIVER: prisma
      DATABASE_URL: ${KONNECT_DATABASE_URL:?KONNECT_DATABASE_URL 가 .env 에 필요하다}
      JWT_SECRET: ${KONNECT_JWT_SECRET:?KONNECT_JWT_SECRET 가 .env 에 필요하다}
      JWT_EXPIRES_IN: ${KONNECT_JWT_EXPIRES_IN:-1d}
      # FE 와 같은 오리진으로 서빙하므로 브라우저發 교차출처 요청은 없다.
      # 값은 형식상 필요해 자기 자신을 넣는다.
      CORS_ORIGIN: ${KONNECT_PUBLIC_ORIGIN:-http://localhost:3000}
      # 법제처 OPEN API 인증키(OC). 앱이 KONNECT_ prefix 쪽을 읽는다 —
      # 이 .env 는 한 박스의 여러 앱이 공유하므로 앱별로 이름을 구분한다.
      # `:-` 로 두어 값이 없어도 기동을 막지 않는다. 키가 없으면 법령 감시만
      # 건너뛰고 나머지는 계속 돈다(부분 동작이 의도된 설계다).
      KONNECT_LAW_API_KEY: ${KONNECT_LAW_API_KEY:-}
    # 12GB 박스에서 한 서비스가 전체를 먹지 않도록 상한을 둔다.
    mem_limit: 768m
    networks:
      - core-network

  konnect-fe:
    image: ${FE_IMAGE:-ghcr.io/hck1205/konnect-fe:latest}
    container_name: konnect-fe
    restart: always
    environment:
      NODE_ENV: production
      PORT: "3000"
      HOSTNAME: 0.0.0.0
      # ⚠️ 서버 렌더는 브라우저와 base 가 다르다. 브라우저는 `/api` 로 보내고
      # Next rewrites 가 프록시하지만 **서버에는 그 rewrites 가 없다** —
      # 절대 주소가 필요하다. 이게 없으면 lib/apiBase 가 http://localhost:4000 으로
      # 떨어지고, 컨테이너 안에서 그 주소는 아무것도 아니다.
      # 상세 페이지가 SSR 이어야 색인되는데(검색이 유일한 유입) 그게 조용히 깨진다.
      API_INTERNAL_URL: http://konnect-be:4000
    mem_limit: 768m
    depends_on:
      - konnect-be
    networks:
      - core-network

  # 배포 시 일회성으로 실행하는 마이그레이터.
  # 컨테이너 교체 **전에** 스키마를 맞춰야 하므로 별도 서비스로 분리했다
  # (`up -d` 에 섞으면 순서 제어가 안 된다). profiles 로 기본 기동에서 제외한다.
  migrate:
    image: ${BE_IMAGE:-ghcr.io/hck1205/konnect-be:latest}
    profiles: ["tools"]
    environment:
      DATABASE_URL: ${KONNECT_DATABASE_URL:?KONNECT_DATABASE_URL 가 .env 에 필요하다}
    command: ["./node_modules/.bin/prisma", "migrate", "deploy"]
    networks:
      - core-network

  # 공식 출처 감시. cron 이 하루 1회 일회성으로 부른다(deploy/a1-watch-sources.sh).
  # migrate 와 **같은 패턴**이다 — profiles 로 `up -d` 에서 제외한다.
  #
  # GitHub Actions 가 아니라 서버에서 도는 이유: 법제처 OPEN API 가 호출 IP 를
  # 사전 등록하게 한다. 러너 IP 는 매번 바뀐다 → A1 은 고정 IP 라 한 번이면 끝난다.
  watch-sources:
    image: ${BE_IMAGE:-ghcr.io/hck1205/konnect-be:latest}
    profiles: ["tools"]
    environment:
      # 없으면 법령 3건만 건너뛰고 페이지 감시는 계속 돈다.
      KONNECT_LAW_API_KEY: ${KONNECT_LAW_API_KEY:-}
      # 레지스트리는 이미지 안 /app/data 에 있다. 여기에 볼륨을 걸면 레지스트리가
      # **가려지므로** 쓰기 경로만 /app/var 로 뺀다.
      KONNECT_SOURCE_STATE: /app/var/source-state.json
    volumes:
      - konnect-source-state:/app/var
    command: ["node", "scripts/watch-sources.mjs"]
    # DB 를 쓰지 않는다. core-network 에 붙이면 이 박스에 있는 **다른 앱의
    # postgres·redis 까지 닿는다** — 바깥으로 HTTPS 만 나가면 되므로 따로 둔다.
    networks:
      - watch-egress

networks:
  core-network:
    external: true
  watch-egress:
    driver: bridge

volumes:
  # 감시 기준선. 파생 데이터라 백업 대상이 아니다 — 지워지면 다음 실행이
  # "최초 기록"으로 다시 만든다(그 한 번은 변경 감지를 못 한다).
  konnect-source-state:
