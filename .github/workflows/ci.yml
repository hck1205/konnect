# PR 검증 — main 으로 들어가기 전에 깨진 것을 잡는다.
#
# BE/FE 를 별도 job 으로 나눈다: 한쪽이 실패해도 다른 쪽 결과를 함께 볼 수 있고,
# 병렬로 돌아 대기 시간이 줄어든다.
#
# 여기서는 컨테이너 이미지를 만들지 않는다. 빌드·푸시는 main 병합 후 deploy.yml 몫.

name: CI

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

# 같은 PR 에 연속 푸시하면 이전 실행을 취소한다 — 무료 러너 시간을 아낀다.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:

  backend:
    name: BE (lint · build · test · e2e ×2 드라이버)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: BE

    # BE/README 가 "두 저장소 드라이버가 **같은** e2e 를 통과해야 한다" 를 계약으로
    # 선언한다. 그런데 그 계약이 **어디서도 검증되지 않고 있었다** — CI 는 인메모리만
    # 돌렸고, 개발 기계에 Postgres 나 docker 가 없으면 사람도 못 돌린다.
    # "사람이 기억해서 지켜야 하는 규칙"은 언젠가 반드시 깨진다.
    #
    # 서비스 컨테이너는 무료 러너에서 몇 초면 뜬다. 이 계약의 가치에 비하면 싸다.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: konnect
          POSTGRES_PASSWORD: konnect
          POSTGRES_DB: konnect_test
        ports:
          - 5432:5432
        # 헬스체크가 없으면 Postgres 가 아직 초기화 중일 때 마이그레이션이 붙어
        # 연결 거부로 죽는다 — 그리고 그건 재시도하면 사라지는 종류라
        # "가끔 깨지는 CI" 가 된다.
        options: >-
          --health-cmd "pg_isready -U konnect"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: BE/package-lock.json

      - run: npm ci

      # Prisma 클라이언트가 없으면 타입이 깨져 빌드가 실패한다.
      - name: Generate Prisma client
        run: npx prisma generate

      - run: npm run lint
      - run: npm run build

      # DB_DRIVER 기본값이 memory 라 Postgres 없이 돈다.
      - run: npm test

      # jest 의 rootDir 이 src 라 test/*.e2e-spec.ts 는 위 npm test 에 안 잡힌다.
      # 즉 "남의 질문은 수정할 수 없다" · "숨긴 질문은 남에게 404" · "작성자만 채택한다"
      # 같은 **권한 규칙이 전부 게이트 밖**이었다. 컨트롤러·서비스에 단위 spec 이 없어서
      # 그걸 깨는 변경이 초록으로 통과했다. 인메모리라 Postgres 없이 몇 초면 끝난다.
      #
      # 이름에 'in-memory driver only' 를 박는다 — 안 박으면 이 초록이
      # "두 드라이버 계약까지 지켜진다" 로 읽힌다. Prisma 저장소 경로는 여전히
      # CI 가 한 줄도 실행하지 않는다.
      - name: E2E (in-memory driver)
        run: npm run test:e2e

      # 같은 e2e 를 **Postgres 저장소로 한 번 더** 돌린다. 이것이 계약의 실체다 —
      # 통과 여부가 아니라 **같은 테스트라는 사실**이 계약이므로, 여기에 별도 테스트를
      # 만들면 안 된다. 갈라지는 순간 계약이 사라진다.
      #
      # 과거에 이 대조가 실제로 버그를 잡았다(태그 순서 불일치). 그 뒤로는
      # 아무도 안 돌렸다.
      - name: Migrate test database
        run: npx prisma migrate deploy
        env:
          DATABASE_URL: postgresql://konnect:konnect@localhost:5432/konnect_test?schema=public

      - name: E2E (prisma driver — 두 드라이버 계약)
        run: npm run test:e2e
        env:
          DB_DRIVER: prisma
          DATABASE_URL: postgresql://konnect:konnect@localhost:5432/konnect_test?schema=public

  frontend:
    name: FE (lint · typecheck · test · build · routing)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: FE
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: FE/package-lock.json

      - run: npm ci

      - run: npm run lint
      - run: npm run typecheck
      - run: npm test

      # 서버가 필요 없는 순수 검사 — 디자인 토큰 대비비.
      - run: npm run check:contrast

      - run: npm run build

      # 로케일 라우팅 검사는 **실행 중인 FE** 가 필요하다.
      # 순수 함수 단위 테스트·타입체크·빌드가 전부 통과해도, proxy 가 잘못된
      # 위치에 있으면 Next 가 조용히 무시해 로케일 경로가 전부 404 가 된다.
      # 실제로 그렇게 죽어 있던 것을 이 검사만 잡아냈다 — 그래서 CI 에 넣는다.
      # BE 는 필요 없다(리다이렉트만 확인한다).
      - name: Start FE and check locale routing
        run: |
          npm start &
          echo $! > /tmp/fe.pid
          for i in $(seq 1 30); do
            curl -sf -o /dev/null http://localhost:3000/en && break
            sleep 1
          done
          npm run check:routing
          kill "$(cat /tmp/fe.pid)" 2>/dev/null || true

# 여기서 돌리지 않는 검사와 그 이유:
#
#   check:seo     실제 서버가 필요하다(BE + DB 가 함께 떠 있어야 의미가 있다).
#                 **배포 후 스모크에서 실제로 돈다** — deploy.yml 의
#                 `SEO surface on live server`. 그전까지는 이 주석이
#                 "deploy.yml 에서 돈다" 고 말하는데 그 job 에는 스텝이
#                 하나뿐이었다(주석이 코드보다 앞서 있던 자리).
#
#   check:stories Ladle 서버와 playwright chromium 이 필요하다. PR 마다 브라우저를
#                 받으면 느리고, 컴포넌트 스토리는 배포 산출물이 아니다.
#                 디자인 시스템을 손댈 때 로컬에서 돌린다.
