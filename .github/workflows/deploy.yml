# main 병합 시 배포 — ARM 러너에서 네이티브 빌드 → GHCR → SSH 배포.
#
# 왜 이 형태인가 (기각한 대안 포함) → ~/docs/fleet/konnect-deploy.md
#   - ARM 러너 네이티브 빌드: A1 이 aarch64 다. QEMU 크로스빌드는 수 배 느리다.
#   - 서버 빌드 금지: next build 는 2~4GB 를 쓴다. 2 OCPU 프로덕션 박스에서
#     빌드하면 서비스가 흔들린다. 서버는 pull + 실행만 한다.
#   - 셀프호스티드 러너 기각: 공개 저장소에서 fork PR 이 러너에 코드를 실행할 수 있다.

name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# 배포가 겹치면 컨테이너 교체 순서가 엉킨다. 취소하지 않고 **줄을 세운다** —
# 진행 중인 배포를 중간에 끊으면 마이그레이션만 적용된 상태로 남을 수 있다.
concurrency:
  group: deploy-main
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io

jobs:

  build:
    name: Build arm64 images → GHCR
    runs-on: ubuntu-24.04-arm   # 공개 저장소는 ARM 러너 무료
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Compute image tag
        id: meta
        # 커밋 SHA 로 태그한다. latest 만 쓰면 무엇이 돌고 있는지 알 수 없고
        # 롤백할 지점도 사라진다.
        run: echo "tag=${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push BE
        uses: docker/build-push-action@v6
        with:
          context: ./BE
          push: true
          platforms: linux/arm64
          tags: |
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/konnect-be:${{ steps.meta.outputs.tag }}
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/konnect-be:latest
          cache-from: type=gha,scope=be
          cache-to: type=gha,mode=max,scope=be

      - name: Build & push FE
        uses: docker/build-push-action@v6
        with:
          context: ./FE
          push: true
          platforms: linux/arm64
          # rewrites 는 빌드 시점에 고정된다 — 런타임 주입은 반영되지 않는다.
          # compose 서비스명을 넣어 환경이 달라져도 값이 같게 한다.
          build-args: |
            API_PROXY_TARGET=http://konnect-be:4000
          tags: |
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/konnect-fe:${{ steps.meta.outputs.tag }}
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/konnect-fe:latest
          cache-from: type=gha,scope=fe
          cache-to: type=gha,mode=max,scope=fe

  deploy:
    name: Deploy to A1
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          # 배포 키에 authorized_keys 의 command= 제약이 걸려 있어, 여기서 무엇을
          # 보내든 서버는 /srv/app/konnect/deploy.sh 만 실행한다. 보낸 문자열은
          # $SSH_ORIGINAL_COMMAND 로 전달되어 **태그 인자**가 된다.
          #
          # 그래서 태그만 보낸다. envs: 로 넘기면 액션이 `export TAG=...;` 를
          # 앞에 붙여 보내는데, 그러면 첫 단어인 `export` 가 태그가 되어
          # 존재하지 않는 이미지를 받으려다 실패한다(실제로 겪음).
          script: ${{ needs.build.outputs.tag }}

  smoke:
    name: Post-deploy smoke test
    needs: [build, deploy]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: FE/package-lock.json

      - run: npm ci
        working-directory: FE

      # ── TLS 검증을 끄는 것은 **자동으로 해제된다** ──────────────────
      #
      # ⚠️ 예전에는 `NODE_TLS_REJECT_UNAUTHORIZED: '0'` 을 무조건 켜 뒀다.
      # 지금은 self-signed 라 필요하지만, 정식 인증서로 바꾼 뒤에도 그대로 남으면
      # **만료된 인증서까지 정상으로 보인다** — 감시하고 있다고 믿는데 실은
      # 안 하는 상태다. 이 저장소는 uptime-kuma 에서 같은 함정을 이미 기록해 뒀다.
      #
      # 그래서 **주소 모양으로 판정한다**: 호스트가 IP 면 self-signed 이므로 끄고,
      # 도메인이면 켠다. 도메인을 넣는 날 사람이 아무것도 안 해도 검증이 살아난다 —
      # 체크리스트에 한 줄 적어 두는 것보다 낫다(체크리스트는 잊힌다).
      - name: Decide TLS verification
        id: tls
        env:
          BASE_URL: ${{ secrets.PUBLIC_BASE_URL }}
        run: |
          host="$(printf '%s' "$BASE_URL" | sed -E 's|^[a-z]+://||; s|[:/].*$||')"
          if printf '%s' "$host" | grep -qE '^[0-9]+(\.[0-9]+){3}$'; then
            echo "reject=0" >> "$GITHUB_OUTPUT"
            echo "IP 주소($host) — self-signed 이므로 TLS 검증을 끈다"
          else
            echo "reject=1" >> "$GITHUB_OUTPUT"
            echo "도메인($host) — TLS 검증을 켠다"
          fi

      # 배포된 실물에 대고 확인한다. CI 에서는 데이터가 없어 못 하는 검사다.
      - name: Locale routing on live server
        working-directory: FE
        env:
          BASE_URL: ${{ secrets.PUBLIC_BASE_URL }}
          NODE_TLS_REJECT_UNAUTHORIZED: ${{ steps.tls.outputs.reject }}
        run: npm run check:routing

      # ── 색인 표면이 실제로 색인 가능한지 ────────────────────────────
      #
      # ⚠️ `check:seo` 는 만들어 두고 **어느 워크플로도 부르지 않았다.**
      # ci.yml 의 주석은 "deploy.yml 에서 돈다" 고 적었는데 그 job 에는
      # 스텝이 하나뿐이었다 — 주석이 코드보다 앞서 있던 자리다.
      #
      # 검사가 필요한 이유: 빌드·타입체크가 전부 통과해도 **본문이 HTML 에 없을
      # 수 있다.** 클라이언트에서 데이터를 받으면 첫 HTML 은 로딩 상태이고
      # 크롤러는 그것만 본다 — 검색이 유일한 유입 채널인 이 서비스에서는 손실이다.
      #
      # 질문 데이터가 없어도 **척추 페이지는 0건에서도 성립한다** — 그래서
      # 여기서 검사할 대상이 있다. 법령 인용이 HTML 에 실려 있는지를 본다.
      - name: SEO surface on live server
        working-directory: FE
        env:
          SEO_URL: ${{ secrets.PUBLIC_BASE_URL }}/en/visa/f-2
          # 이 페이지에만 있는 문구를 요구한다 — 총량만 보면 네비·푸터·안전
          # 고지만으로 통과해 **본문이 비어도 초록**이 된다(결함 주입으로 확인된 함정)
          SEO_MUST_CONTAIN: 'Residence (F-2)|출입국관리법 시행령'
          NODE_TLS_REJECT_UNAUTHORIZED: ${{ steps.tls.outputs.reject }}
        run: npm run check:seo
