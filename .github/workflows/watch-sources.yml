# 공식 출처 감시 — 하루 1회.
#
# **글을 생성하지 않는다.** 정부 문서가 바뀌었는지만 확인하고, 바뀌면 이슈로 알린다.
# 해석은 사람의 몫이다 — 비자 전문가가 없는 상태에서 자동 요약은
# R1 영역의 틀린 안내를 대량 생산한다.
#   → docs/20-product/10-features/11-official-sources.md

name: Watch official sources

on:
  schedule:
    # 09:00 KST (00:00 UTC). 법령은 하루에 두 번 바뀌지 않는다.
    - cron: '0 0 * * *'
  workflow_dispatch:

# 겹쳐 돌면 상태 파일이 엉킨다. 줄을 세운다.
concurrency:
  group: watch-sources
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write   # 상태 파일 커밋
      issues: write     # 변경 알림
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check sources
        id: watch
        working-directory: BE
        env:
          # 없으면 법령(statute)은 건너뛴다 — 페이지 감시는 계속 돈다.
          # https://open.law.go.kr 에서 무료 발급
          LAW_API_KEY: ${{ secrets.LAW_API_KEY }}
        run: |
          set +e
          node scripts/watch-sources.mjs | tee /tmp/watch.log
          echo "exit=$?" >> "$GITHUB_OUTPUT"
          # 변경 건수를 뽑아 다음 스텝이 쓴다
          grep -c '⚠' /tmp/watch.log | xargs -I{} echo "changes={}" >> "$GITHUB_OUTPUT"

      # 상태 파일은 **변경 여부의 기준선**이다. 커밋하지 않으면 매일 "최초 기록"이 된다.
      - name: Commit state
        run: |
          git config user.name  "konnect-source-watcher"
          git config user.email "noreply@github.com"
          git add BE/data/source-state.json
          git diff --cached --quiet || git commit -m "chore(sources): 감시 상태 갱신 [skip ci]"
          git push

      # 변경이 있으면 사람에게. 이슈로 남겨야 "봤다/안 봤다"가 추적된다.
      - name: Open issue on change
        if: steps.watch.outputs.changes != '0'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const log = fs.readFileSync('/tmp/watch.log', 'utf8');
            const today = new Date().toISOString().slice(0, 10);
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `공식 출처 변경 감지 — ${today}`,
              labels: ['sources'],
              body: [
                '공식 문서가 바뀌었다. **자동으로 글을 고치지 않는다** — 사람이 확인해야 한다.',
                '',
                '```',
                log.trim(),
                '```',
                '',
                '### 확인할 것',
                '- [ ] 무엇이 바뀌었는지 원문에서 확인',
                '- [ ] 영향받는 태그의 질문·답변을 "확인 필요"로 표시',
                '- [ ] 바뀐 내용이 기존 답변과 충돌하면 답변에 갱신 표시',
                '',
                '> 전문가가 없으므로 **해석을 새로 쓰지 않는다.** 출처 링크와 변경 사실만 갱신한다.',
              ].join('\n'),
            });

      # 수집 실패는 변경과 다르다 — 서버가 죽었거나 URL 이 바뀐 것이다.
      - name: Fail if fetch failed
        if: steps.watch.outputs.exit != '0'
        run: |
          echo "출처 수집에 실패했다. URL 이 바뀌었거나 서버가 응답하지 않는다."
          exit 1
